<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf4ef">
<title>滑動展示</title>
<style>
  :root {
    --ink: #2f2a3a;          /* 主文字：深紫灰 */
    --ink-soft: #6f6878;     /* 副標題／提示 */
    --accent: #d9708a;       /* 點綴：柔和櫻桃粉 */
    --dot: rgba(47, 42, 58, .22);
    --duration: 700ms;       /* 淡入淡出時間 */
    --ease: cubic-bezier(.22, .61, .36, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;              /* 不使用原生頁面捲動 */
    overscroll-behavior: none;     /* 阻止回彈及下拉重新整理 */
  }

  body {
    color: var(--ink);
    font-family: 'PingFang HK', 'PingFang TC', 'Noto Sans TC', 'Noto Sans CJK TC',
                 'Microsoft JhengHei', 'Heiti TC', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    /* 柔和漸變背景：奶油白 → 淡粉 → 淡藍 */
    background:
      radial-gradient(60vmax 60vmax at 12% 8%, rgba(255, 214, 196, .55), transparent 60%),
      radial-gradient(55vmax 55vmax at 92% 95%, rgba(206, 220, 250, .6), transparent 60%),
      linear-gradient(160deg, #fdf7f1 0%, #f9eff3 52%, #eff3fb 100%);
    background-attachment: fixed;
  }

  .stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;                 /* 後備 */
    height: 100dvh;                /* 動態視窗高度（流動裝置網址列） */
    overflow: hidden;
    touch-action: none;            /* 由腳本處理觸控手勢 */
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: max(24px, env(safe-area-inset-top)) clamp(24px, 8vw, 96px) max(24px, env(safe-area-inset-bottom));
    opacity: 0;
    visibility: hidden;
    transform: translateY(28px);
    transition:
      opacity var(--duration) var(--ease),
      transform var(--duration) var(--ease),
      visibility 0s linear var(--duration);
  }
  /* 向上翻頁時，從上方淡入 */
  .stage.is-back .slide:not(.is-active) { transform: translateY(-28px); }
  .stage.is-back .slide.is-leaving       { transform: translateY(28px); }
  .stage:not(.is-back) .slide.is-leaving { transform: translateY(-28px); }

  .slide.is-active {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition:
      opacity var(--duration) var(--ease) 120ms,
      transform var(--duration) var(--ease) 120ms,
      visibility 0s;
  }

  .slide__title {
    margin: 0;
    font-size: clamp(2.6rem, 11vw, 6.5rem);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: .06em;
    text-indent: .06em;            /* 抵消字距，令文字視覺置中 */
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .slide__title::after {
    content: "";
    display: block;
    width: clamp(36px, 5vw, 56px);
    height: 4px;
    margin: clamp(18px, 3vh, 28px) auto 0;
    border-radius: 2px;
    background: var(--accent);
    opacity: .75;
  }
  .slide__subtitle {
    margin: clamp(14px, 2.4vh, 22px) 0 0;
    max-width: 32em;
    font-size: clamp(1rem, 2.4vw, 1.4rem);
    font-weight: 400;
    line-height: 1.7;
    letter-spacing: .04em;
    color: var(--ink-soft);
  }

  /* 第一頁的「向下滑動」提示 */
  .hint {
    position: absolute;
    left: 50%;
    bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px));
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: clamp(.8rem, 1.6vw, .95rem);
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--ink-soft);
    opacity: .75;
  }
  .hint__arrow {
    width: 12px;
    height: 12px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    animation: nudge 1.8s var(--ease) infinite;
  }
  @keyframes nudge {
    0%, 100% { transform: translateY(-3px) rotate(45deg); opacity: .5; }
    50%      { transform: translateY(4px)  rotate(45deg); opacity: 1; }
  }

  /* 進度圓點（右側） */
  .dots {
    position: fixed;
    right: max(16px, env(safe-area-inset-right));
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
    z-index: 2;
  }
  .dots button {
    display: block;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    position: relative;
  }
  .dots button::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dot);
    transform: translate(-50%, -50%);
    transition: background .3s, height .3s var(--ease);
  }
  .dots button[aria-current="true"]::before {
    background: var(--accent);
    height: 20px;
    border-radius: 4px;
  }
  .dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  @media (max-width: 600px) {
    .dots { right: 8px; gap: 8px; }
  }

  /* 減少動態效果：即時切換 */
  @media (prefers-reduced-motion: reduce) {
    .slide, .slide.is-active, .dots button::before { transition: none !important; }
    .slide, .stage .slide:not(.is-active), .stage .slide.is-leaving { transform: none !important; }
    .hint__arrow { animation: none; transform: rotate(45deg); }
  }
</style>
</head>
<body>
  <main class="stage" id="stage" tabindex="-1" aria-roledescription="輪播" aria-label="內容展示"></main>
  <nav aria-label="頁面導覽"><ol class="dots" id="dots"></ol></nav>

<script>
/* =====================================================================
 * 內容設定 — 只需修改此陣列即可。
 *   title    : 大標題（必填）
 *   subtitle : 副標題（選填，留空則不顯示）
 * 新增或刪除項目後，頁面及右側進度圓點會自動更新。
 * ===================================================================== */
const sections = [
  { title: '小童好睡',   subtitle: '' },
  { title: '清新櫻桃糖', subtitle: '' },
  { title: '最新優惠',   subtitle: '' },
];

/* ---------------- 互動參數（一般無需修改） ---------------- */
const CONFIG = {
  cooldownMs: 800,        // 每次翻頁後的鎖定時間
  wheelThreshold: 30,     // 累積滾動量（px）達此值才翻頁
  wheelGapMs: 200,        // 滾輪事件間隔超過此值，才視為新的手勢（用以略過慣性尾段）
  swipeMinPx: 40,         // 觸控滑動最短距離
};

(function () {
  'use strict';

  const stage = document.getElementById('stage');
  const dotsEl = document.getElementById('dots');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ---------- 由陣列產生頁面 ---------- */
  const slides = sections.map((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide';
    el.setAttribute('aria-roledescription', '頁面');
    el.setAttribute('aria-label', `第 ${i + 1} 頁，共 ${sections.length} 頁`);

    const h = document.createElement(i === 0 ? 'h1' : 'h2');
    h.className = 'slide__title';
    h.textContent = s.title || '';
    el.appendChild(h);

    if (s.subtitle && String(s.subtitle).trim()) {
      const p = document.createElement('p');
      p.className = 'slide__subtitle';
      p.textContent = s.subtitle;
      el.appendChild(p);
    }

    if (i === 0 && sections.length > 1) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.setAttribute('aria-hidden', 'true');
      hint.innerHTML = '<span>向下滑動</span><span class="hint__arrow"></span>';
      el.appendChild(hint);
    }

    stage.appendChild(el);
    return el;
  });

  const dots = sections.map((s, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', `前往第 ${i + 1} 頁：${s.title}`);
    b.addEventListener('click', () => goTo(i, true));
    li.appendChild(b);
    dotsEl.appendChild(li);
    return b;
  });
  if (sections.length < 2) dotsEl.hidden = true;

  /* ---------- 狀態與切換 ---------- */
  let index = -1;
  let lockedUntil = 0;

  function now() { return performance.now(); }
  function isLocked() { return now() < lockedUntil; }

  function goTo(next, force) {
    next = Math.max(0, Math.min(sections.length - 1, next));
    if (next === index) return false;
    if (!force && isLocked()) return false;

    const prev = index;
    stage.classList.toggle('is-back', prev !== -1 && next < prev);
    slides.forEach((el, i) => {
      el.classList.toggle('is-active', i === next);
      el.classList.toggle('is-leaving', i === prev);
      el.setAttribute('aria-hidden', i === next ? 'false' : 'true');
    });
    dots.forEach((d, i) => d.setAttribute('aria-current', i === next ? 'true' : 'false'));
    index = next;
    stage.dataset.index = String(next);
    lockedUntil = now() + (reduceMotion.matches ? Math.min(CONFIG.cooldownMs, 450) : CONFIG.cooldownMs);
    return true;
  }
  const step = (dir) => goTo(index + dir);

  /* ---------- 滾輪／觸控板 ----------
   * 一次觸控板輕掃會連續發出大量 wheel 事件（含慣性尾段）。
   * 規則：
   *  1. 同一手勢內累積 deltaY，超過門檻才翻頁一次；
   *  2. 翻頁後，該手勢餘下的事件（包括慣性）全部略過，
   *     直至事件之間出現 wheelGapMs 的停頓，且冷卻時間已過，才接受新手勢。
   */
  let wheelAccum = 0;
  let lastWheelAt = -Infinity;
  let gestureUsed = false;

  function normalizeDelta(e) {
    if (e.deltaMode === 1) return e.deltaY * 16;                 // 行
    if (e.deltaMode === 2) return e.deltaY * window.innerHeight; // 頁
    return e.deltaY;                                             // 像素
  }

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey) return; // 觸控板雙指縮放
    const t = now();
    const dy = normalizeDelta(e);
    const newGesture = t - lastWheelAt > CONFIG.wheelGapMs;
    lastWheelAt = t;

    if (newGesture) { gestureUsed = false; wheelAccum = 0; }
    if (gestureUsed || isLocked()) {
      // 慣性尾段或冷卻期間：延續「已使用」狀態，等待真正的停頓
      gestureUsed = true;
      wheelAccum = 0;
      return;
    }
    if (dy === 0) return;
    if (wheelAccum !== 0 && Math.sign(dy) !== Math.sign(wheelAccum)) wheelAccum = 0;
    wheelAccum += dy;

    if (Math.abs(wheelAccum) >= CONFIG.wheelThreshold) {
      step(wheelAccum > 0 ? 1 : -1);
      gestureUsed = true;
      wheelAccum = 0;
    }
  }, { passive: false });

  /* ---------- 觸控 ---------- */
  let touchStart = null;

  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { touchStart = null; return; }
    const p = e.touches[0];
    touchStart = { x: p.clientX, y: p.clientY };
  }, { passive: true });

  // 阻止原生捲動、回彈及下拉重新整理
  document.addEventListener('touchmove', (e) => {
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  stage.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const p = e.changedTouches[0];
    const dx = p.clientX - touchStart.x;
    const dy = p.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dy) < CONFIG.swipeMinPx || Math.abs(dy) < Math.abs(dx)) return;
    step(dy < 0 ? 1 : -1); // 手指向上掃 → 下一頁
  }, { passive: true });

  stage.addEventListener('touchcancel', () => { touchStart = null; }, { passive: true });

  /* ---------- 鍵盤 ---------- */
  window.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
    let handled = true;
    switch (e.key) {
      case 'ArrowDown': case 'PageDown': step(1); break;
      case 'ArrowUp':   case 'PageUp':   step(-1); break;
      case ' ': case 'Spacebar':
        if (tag === 'BUTTON') { handled = false; break; } // 讓空白鍵可啟動圓點按鈕
        step(e.shiftKey ? -1 : 1); break;
      case 'Home': goTo(0); break;
      case 'End':  goTo(sections.length - 1); break;
      default: handled = false;
    }
    if (handled) e.preventDefault();
  });

  /* ---------- 初始化 ---------- */
  goTo(0, true);
  lockedUntil = 0;
  stage.focus({ preventScroll: true });
})();
</script>
</body>
</html>
